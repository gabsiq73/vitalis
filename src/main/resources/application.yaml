spring:
  application:
    name: Vitalis
  autoconfigure:
  exclude: org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT}/vitalis
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  file:
    name: app.log
  level:
    root: warn
    com:
      vitalis:
        demo: trace