spring:
  application:
    name: Vitalis
  autoconfigure:
  exclude: org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT}/vitalis
    username: postgres
    password: ${DB_PASSWORD:postgres}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    baseline-version: 1

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  file:
    name: app.log
  level:
    root: warn
    com:
      vitalis:
        demo: trace

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
